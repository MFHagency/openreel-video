name: secret-scan
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks on changed commits only
        shell: bash
        run: |
          set -euo pipefail
          V="$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oE '"tag_name":[[:space:]]*"v[^"]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "gitleaks version: $V"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          chmod +x gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${HEAD}~1" 2>/dev/null || echo "$HEAD")"
          fi
          echo "Scanning range ${BASE}..${HEAD}"
          ./gitleaks detect --source . --redact --no-banner --log-opts="${BASE}..${HEAD}" --exit-code 1

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog on changed commits only
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown
